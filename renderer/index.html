<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Smooth My Video</title>
<style>
  :root { --green:#76b900; --panel:#252524; --bg:#151515; --text:#f0efec; --sub:#959490; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px; background:var(--bg); color:var(--text);
         font-family:'Segoe UI',sans-serif; font-size:16px; }   /* 16px floor for all text */
  h1 { margin:0; font-size:22px; }
  .sub { color:var(--sub); font-size:16px; margin:2px 0 14px; }
  button { font:inherit; padding:7px 12px; border:0; border-radius:6px; cursor:pointer; }
  .panel { background:var(--panel); border-radius:8px; padding:12px 14px; margin:10px 0; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .row > button { white-space:nowrap; flex-shrink:0; }
  .k { color:var(--sub); width:140px; flex-shrink:0; } .v { font-family:Consolas,monospace; }
  /* Pipeline order: numbered panels count only when rendered, so Live mode (which hides
     the .vonly panels) renumbers itself with no gaps. */
  #workspace { counter-reset: step; }
  .panel.step { counter-increment: step; }
  .panel.step > .row:first-child > .k::before { content: counter(step) " "; color:var(--green); font-family:Consolas,monospace; }
  .panel.step > .row:first-child > .k { white-space:nowrap; }
  #go { background:var(--green); color:#0d0d0d; font-weight:700; font-size:16px; padding:10px 18px; }
  #go:disabled { background:#3f3f3e; color:#898781; cursor:default; }
  select, input { font:inherit; background:#101010; color:var(--text); border:1px solid #3f3f3e;
                  border-radius:5px; padding:5px 8px; }
  /* Sliders must not inherit the box padding/border above: Chromium paints the range track across
     the whole box but confines the thumb travel and fill to the content area, so a padded slider
     shows an unfilled stub of track past the thumb at both extremes (white gap at 100%). */
  input[type=range] { padding:0; border:0; background-color:transparent; }
  select:disabled, input:disabled { opacity:.45; cursor:not-allowed; }
  #bar { position:relative; height:28px; background:#101010; border-radius:14px; overflow:hidden; }
  #fill { height:100%; width:0; background:var(--green); transition:width .15s; }
  /* Target-fps stepper ([-] value [unit] [+]). */
  .stepper { display:inline-flex; align-items:stretch; height:30px; border:1px solid #353534;
             border-radius:5px; overflow:hidden; vertical-align:middle; }
  .stepper button, .stepper input, .stepper .mx { box-sizing:border-box; }
  .stepper button { width:26px; background:#1d1d1c; color:var(--text); border:0; border-radius:0;
                    border-inline-end:1px solid #353534; cursor:pointer; font-size:17px; line-height:1; padding:0; }
  .stepper button:last-child { border-inline-end:0; border-inline-start:1px solid #353534; }
  .stepper button:hover:not(:disabled) { background:#252524; color:var(--green); }
  .stepper button:disabled { opacity:.4; cursor:default; }
  .stepper input { border:0; background:#151515; color:var(--text); text-align:center; padding:0 2px; font-size:14px; }
  .stepper input:disabled { opacity:.5; }
  .stepper .mx { display:flex; align-items:center; padding-block:0; padding-inline:3px 7px; background:#151515; color:#898781; font-size:13px; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .roundbtn { width:26px; height:26px; padding:0; border:1px solid #353534; border-radius:50%; background:#1d1d1c;
    color:var(--text); font-size:15px; line-height:1; cursor:pointer; flex:0 0 auto; }
  .roundbtn:hover:not(:disabled) { background:#252524; color:var(--green); border-color:var(--green); }
  .roundbtn:disabled { opacity:.4; cursor:default; }
  #fpsin { width:84px; }
  .eq { padding:0 9px; color:#898781; }
  /* Speed mode selector: one control, three mutually exclusive answers to "what output rate?" */
  .seg { display:inline-flex; align-items:stretch; height:30px; border:1px solid #353534;
         border-radius:6px; overflow:hidden; }
  .seg button { background:#1d1d1c; color:var(--text); border:0; border-inline-end:1px solid #353534;
                padding:0 12px; font-size:16px; line-height:1; cursor:pointer; }
  .seg button:last-child { border-inline-end:0; }
  .seg button:hover:not(:disabled):not(.on) { background:#252524; color:var(--green); }
  .seg button.on { background:var(--green); color:#0d0d0d; font-weight:600; }
  .seg button:disabled { opacity:.4; cursor:default; }
  /* Mode switch = the same segmented control, scaled up: it is the first choice on the page. */
  .modeseg { height:36px; }
  .modeseg button { font-size:18px; padding:0 18px; }
  /* The two UI modes. Video mode hides every .lonly element, Live mode every .vonly one;
     anything carrying neither class is shared and stays on screen in both. !important because
     most of these panels are shown by JS inline styles (welcome, info, previewpanel, lvpanel,
     workspace), and an inline display must never leak the other mode's UI back on screen. */
  html.mode-live .vonly { display:none !important; }
  html.mode-video .lonly { display:none !important; }
  /* Percentage painted on top of the fill, centred in the bar (taller bar so the larger text fits). */
  #pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
         color:#fff; font-size:22px; font-weight:600; pointer-events:none;
         text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #log { background:#101010; color:#cdccca; font-family:Consolas,monospace; font-size:16px;
         height:150px; overflow:auto; white-space:pre-wrap; padding:8px; border-radius:6px; }
  .hint { color:var(--sub); font-size:16px; }
  body.drag { outline:3px dashed var(--green); outline-offset:-10px; }
  button.mini { padding:3px 9px; font-size:16px; background:#353534; color:var(--text); }
  /* Compare: the 2x2 of real frames (left) and the two models' new frames (right) */
  #cmpgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  /* The before / after preview: the original is drawn over the result and clipped at --split, a share of the
     pane's width; #prevsplit is the divider that drags it. The pane stays left-to-right in every language. */
  #prevpair { position:relative; direction:ltr; overflow:hidden; border-radius:6px; --split:50%;
              --ar:1.7778; --prevh:60vh; width:min(100%, calc(var(--prevh) * var(--ar))); margin-inline:auto; }
  /* The pane is the picture's own box, centred: as large as fits the row and --prevh of the window at the
     picture's aspect (--ar); zoomed 1:1, no wider than the result's native width (--natw) plus a scrollbar. */
  #prevpair.zoomed { width:min(100%, calc(var(--natw, 100%) + 17px)); }
  #prevorigwrap { position:absolute; inset:0; clip-path:inset(0 calc(100% - var(--split)) 0 0); }
  .prevtag { position:absolute; top:8px; max-width:44%; padding:2px 10px; border:1px solid var(--green);
             border-radius:999px; background:rgba(13,13,13,.72); color:var(--text); font-size:14px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  .prevtag:empty { display:none; }
  #prevoriglabel { inset-inline-start:8px; }
  #prevproclabel { inset-inline-end:8px; }
  #prevsplit { position:absolute; top:0; bottom:0; inset-inline-start:var(--split); width:2px; translate:-1px 0;
               background:var(--green); box-shadow:0 0 0 1px rgba(0,0,0,.45); cursor:ew-resize; touch-action:none;
               outline:none; }
  #prevsplit::before { content:""; position:absolute; top:0; bottom:0; inset-inline:-10px; }
  #prevsplit span { position:absolute; top:50%; inset-inline-start:50%; translate:-50% -50%; width:34px; height:34px;
                    display:flex; align-items:center; justify-content:center; border-radius:50%;
                    background:var(--green); color:#0d0d0d; box-shadow:0 0 0 2px rgba(0,0,0,.45); }
  #prevsplit:focus-visible span { box-shadow:0 0 0 2px #fff; }
  .prevspin { position:absolute; inset:0; align-items:center; justify-content:center; pointer-events:none; }
  .cmpwrap { overflow:hidden; border-radius:6px; position:relative; }
  .cmpwrap img { width:100%; display:block; cursor:zoom-in; }
  .cmpspin { display:none; position:absolute; align-items:center; justify-content:center; pointer-events:none; }
  .spinwheel { width:34px; height:34px; border:3px solid rgba(255,255,255,.25);
               border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite;
               filter:drop-shadow(0 0 2px rgba(0,0,0,.7)); }
  /* Small red tick marking the default position on a slider. Chromium no longer paints author
     backgrounds on native range inputs (a background-image tick on the input itself silently
     stopped rendering with an Electron upgrade), so the tick lives on a wrapper span around the
     slider: layered UNDER it (isolation keeps the negative z-index inside the wrapper) and 2px
     taller at each end, so it peeks out above and below the track wherever the thumb is. All
     current defaults sit mid-scale; a slider with an off-centre default would override the left
     offset inline. Fades with the control when disabled. */
  .defmark { position:relative; display:inline-flex; align-items:center; isolation:isolate; }
  .defmark::before { content:''; position:absolute; inset-inline-start:calc(var(--def, 50%) - 1px); top:-2px; bottom:-2px;
                     width:2px; background:#e85c5c; z-index:-1; }
  /* --def on the wrapper moves the tick for an off-centre default (the DLSS mode slider's DLAA
     sits at the right end, inset by the half thumb) */
  .defmark:has(input:disabled)::before { opacity:.45; }
  /* Right to left (Arabic, app-i18n.ts applyI18n sets <html dir>): the layout mirrors, the sliders and their default tick
     with it; the before / after pair and the Compare grid stay left to right (their zoom scrolls by scrollLeft, Save
     image draws the grid left to right), so do the log and the output path; the file line reads in its own direction */
  html[dir=rtl] #prevpair, html[dir=rtl] #cmpgrid, html[dir=rtl] #log, html[dir=rtl] #out { direction:ltr; }
  html[dir=rtl] #prevpair .hint, html[dir=rtl] #cmpgrid .hint, html[dir=rtl] #path { unicode-bidi:plaintext; }
  /* the video's own values (1920 x 1080, 0:00:01) read left to right inside the mirrored rows */
  html[dir=rtl] #res, html[dir=rtl] #fps, html[dir=rtl] #dur, html[dir=rtl] #codec { direction:ltr; unicode-bidi:isolate; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
<script>
  // Set the UI mode class BEFORE the body renders, so launching in Live mode never flashes the
  // video UI first. setMode() in the main script keeps this class and the stored key in sync.
  try {
    document.documentElement.className =
      'mode-' + (localStorage.getItem('uiMode') === 'live' ? 'live' : 'video');
  } catch (e) { document.documentElement.className = 'mode-video'; }
</script>
</head>
<body>
  <!-- Every visible text lives in i18n\<lang>.json: data-i18n = the element's content, data-i18n-title / -ph / -aria /
       -alt = that attribute (app-i18n.ts applyI18n). Elements the code relabels at run time (status lines, the setup
       states, the Go buttons, the preview labels) carry no key: the code sets them through t(). -->
  <div class="row" style="justify-content:space-between;margin:0">
    <h1>Smooth My Video</h1>
    <div class="row" style="margin:0">
      <!-- the Update button, Chrome's pattern: shown once a newer version is downloaded and unpacked (main's
           autoUpdate, app-update.ts); its click restarts into it, otherwise the next launch applies it -->
      <button id="updbtn" style="display:none;background:var(--green);color:#0d0d0d;font-weight:700" data-i18n-title="update.btn.tip"></button>
      <select id="langsel" data-i18n-title="lang.tip" data-i18n-aria="lang.tip"></select>
    </div>
  </div>
  <div class="sub" data-i18n="app.tagline"></div>
  <!-- One-line update notice; hidden unless main's launch-time release check finds a newer build. Its text follows the
       background download (app-update.ts updLine); the tick turns the automatic update off and on. -->
  <div id="update" class="hint" style="display:none;margin:2px 0 6px">
    <span id="updtxt"></span> <a id="updatelink" href="#" style="color:var(--green)" data-i18n="update.link"></a>
    <label style="margin-inline-start:12px;white-space:nowrap" data-i18n-title="update.auto.tip"><input type="checkbox" id="updauto"> <span data-i18n="update.auto"></span></label>
  </div>

  <!-- MODE SWITCH. The app does two unrelated things (render a video file, and smooth a live
       window in real time), and showing both entry points at once read as one confusing flow.
       Each mode now shows only its own entry action (.vonly / .lonly); the interpolation model,
       Speed, Image scale, RTX and Sharpen settings carry no class because both modes use them.
       The choice persists in localStorage.uiMode and is painted by the head script. -->
  <div class="row">
    <span class="seg modeseg" id="modeseg">
      <button type="button" id="modevideo"></button>
      <button type="button" id="modelive"></button>
    </span>
  </div>

  <div class="row vonly">
    <button id="pick" data-i18n="pick.btn"></button>
    <span id="path" class="hint"></span>
  </div>

  <!-- Empty state: shown until a video is loaded (or an RTX install begins), then replaced by #workspace. -->
  <div id="welcome" class="panel vonly" style="text-align:center;padding:40px 20px">
    <div style="font-size:15px;margin-bottom:8px" data-i18n="welcome.title"></div>
    <div class="hint" data-i18n="welcome.body"></div>
  </div>

  <!-- Live mode: real-time frame generation over any window on screen (no file involved).
       engine/live/smv-live.exe captures the picked window (Windows.Graphics.Capture) and covers
       it with a click-through topmost overlay presenting interpolated output. Independent of the
       file workflow below, so it lives OUTSIDE #workspace - and ABOVE it, so nobody has to
       scroll to discover it. The output rate is INHERITED from the Speed selectors below
       (RIFE/GMFSS resample adaptively to the fps target; DLSS 4.5 approximates it with
       the first whole multiple of the captured window's rate that reaches it, derived in the exe). -->
  <div class="panel lonly" id="lvpanel" style="display:none">
    <div class="row" style="margin-bottom:2px">
      <span class="k" data-i18n="live.k"></span>
      <span class="hint" data-i18n="live.intro"></span>
    </div>
    <div class="row">
      <button id="lvgo"></button>
      <span class="hint" id="lvtarget"></span>
      <span class="hint" id="lvstat"></span>
    </div>
    <div class="row">
      <span class="k" data-i18n="live.display"></span>
      <select id="lvfit" data-i18n-title="live.fit.tip">
        <option value="monitor" data-i18n="live.fit.monitor"></option>
        <option value="window" data-i18n="live.fit.window"></option>
        <option value="fill" data-i18n="live.fit.fill"></option>
      </select>
      <span class="hint" id="lvfithint"></span>
    </div>
    <div class="row">
      <span class="k" data-i18n="live.extras"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;">
        <input type="checkbox" id="lvhud" checked style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="live.hud"></span>
      </label>
      <label class="hint" id="lvhudlatlbl" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;margin-inline-start:14px;">
        <input type="checkbox" id="lvhudlat" checked style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="live.hudlat"></span>
      </label>
      <span class="hint" style="margin-inline-start:14px" data-i18n="live.hotkey"></span>
      <button id="lvkey" class="mini" data-i18n-title="live.key.tip">`</button>
      <span class="hint" id="lvkeyhint"></span>
    </div>
  </div>

  <!-- Shown in Live mode only when main answered lv-ready = false (the bundled exe is missing). -->
  <div class="panel hint lonly" id="lvunavail" style="display:none" data-i18n="live.unavail"></div>

  <!-- Everything operational: hidden until there's something to act on (see showWorkspace). -->
  <div id="workspace" style="display:none">
  <div class="panel vonly" id="info" style="display:none">
    <div class="row"><span class="k" data-i18n="info.res"></span><span class="v" id="res">-</span></div>
    <div class="row"><span class="k" data-i18n="info.fps"></span><span class="v" id="fps">-</span></div>
    <div class="row"><span class="k" data-i18n="info.dur"></span><span class="v" id="dur">-</span></div>
    <div class="row"><span class="k" data-i18n="info.codec"></span><span class="v" id="codec">-</span></div>
  </div>

  <div class="hint" style="margin:10px 0 0 4px" data-i18n="order.note"></div>

  <div class="panel step" id="nrpanel">
    <div class="row" style="margin-bottom:2px">
      <span class="k" data-i18n="nr.k"></span>
      <span class="hint" data-i18n="nr.intro"></span>
    </div>
    <div class="row" style="flex-wrap:wrap">
      <span class="k"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;" data-i18n-title="nr.tip">
        <input type="checkbox" id="dlssnr" style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="nr.name"></span> <span class="hint" id="dlssnrhint" data-i18n="nr.hint"></span>
      </label>
      <span id="nrwrap" style="display:none;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="hint" data-i18n="nr.style"></span>
        <span class="seg" id="nrstyleseg" style="height:26px">
          <button type="button" data-style="0" class="on" data-i18n="nr.style0" data-i18n-title="nr.style0.tip"></button>
          <button type="button" data-style="1" data-i18n="nr.style1" data-i18n-title="nr.style1.tip"></button>
          <button type="button" data-style="2" data-i18n="nr.style2" data-i18n-title="nr.style2.tip"></button>
        </span>
        <span class="hint" style="margin-inline-start:6px" data-i18n="nr.structure"></span>
        <span class="defmark"><input id="nrstructure" type="range" min="0" max="2" step="0.05" value="1"
               style="width:100px;padding:0;border:0;accent-color:var(--green);"></span>
        <span class="v" id="nrstructurenum">1.00</span>
        <span class="hint" style="margin-inline-start:6px" data-i18n="nr.tone"></span>
        <span class="defmark"><input id="nrtone" type="range" min="0" max="2" step="0.05" value="1"
               style="width:100px;padding:0;border:0;accent-color:var(--green);"></span>
        <span class="v" id="nrtonenum">1.00</span>
        <span class="hint" style="margin-inline-start:6px" data-i18n="nr.passes" data-i18n-title="nr.passes.tip"></span>
        <span class="defmark" style="--def:8px"><input id="nrpasses" type="range" min="1" max="20" step="1" value="1"
               data-i18n-title="nr.passes.tip"
               style="width:200px;padding:0;border:0;accent-color:var(--green);"></span>
        <span class="v" id="nrpassesnum">1</span>
        <label class="hint" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-inline-start:6px"
               data-i18n-title="nr.automask.tip">
          <input type="checkbox" id="nrautomask" checked style="width:auto;padding:0;accent-color:var(--green);">
          <span data-i18n="nr.automask"></span>
        </label>
        <span class="hint" style="margin-inline-start:6px" data-i18n="nr.skin" data-i18n-title="nr.skin.tip"></span>
        <span class="defmark"><input id="nrskin" type="range" min="0" max="2" step="0.05" value="1"
               data-i18n-title="nr.skin.tip"
               style="width:100px;padding:0;border:0;accent-color:var(--green);"></span>
        <span class="v" id="nrskinnum">1.00</span>
        <label class="hint vonly" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-inline-start:6px"
               data-i18n-title="nr.mask.tip">
          <input type="checkbox" id="nrmask" style="width:auto;padding:0;accent-color:var(--green);">
          <span data-i18n="nr.mask"></span>
        </label>
      </span>
    </div>
    <div id="dlssnrsetup" style="display:none;background:#101010;border-radius:6px;padding:10px 12px;margin-top:6px;">
      <div class="row" style="margin:0 0 6px">
        <span id="dlssnrstatus" class="v"></span>
      </div>
      <div class="hint" id="dlssnrsteps" style="line-height:1.6;margin-bottom:8px"></div>
      <div class="row" id="dlssnrbtns" style="flex-wrap:wrap;gap:6px">
        <button id="dlssnrdl" class="mini" data-i18n="nr.dl"></button>
      </div>
    </div>
  </div>

  <div class="panel step" id="interppanel">
    <div class="row">
      <span class="k" data-i18n="interp.k"></span>
      <span class="hint" data-i18n="interp.intro"></span>
    </div>
    <div class="row">
      <span class="k"></span>
      <label class="hint" id="modeldlsslabel" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;" data-i18n-title="dlssg.tip">
        <input type="checkbox" id="modeldlss"
               style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span style="white-space:nowrap;" data-i18n="dlssg.name"></span> <span class="hint" data-i18n="dlssg.hint"></span>
      </label>
    </div>
    <div class="row">
      <span class="k"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;" data-i18n-title="gmfss.tip">
        <input type="checkbox" id="modelgmfss" checked
               style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="gmfss.name"></span> <span class="hint" data-i18n="gmfss.hint"></span>
      </label>
    </div>
    <div class="row">
      <span class="k"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;" data-i18n-title="rife.tip">
        <input type="checkbox" id="modelrife"
               style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="rife.name"></span> <span class="hint" data-i18n="rife.hint"></span>
      </label>
    </div>
    <div class="row" id="rifedrbarow" style="display:none">
      <span class="k"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;margin-inline-start:22px;" data-i18n-title="drba.tip">
        <input type="checkbox" id="rifedrba"
               style="width:auto;padding:0;margin-top:2px;accent-color:var(--green);">
        <span data-i18n="drba.name"></span> <span class="hint" data-i18n="drba.hint"></span>
      </label>
    </div>
    <div class="row">
      <span class="k"></span>
      <label class="hint" style="display:flex;align-items:flex-start;gap:6px;cursor:pointer;" data-i18n-title="nvof.tip">

        <option value="dlssg" data-i18n="cmp.dlssg"></option>
        <option value="fsrfg" data-i18n="cmp.fsrfg"></option>
        <option value="xefg" data-i18n="cmp.xefg"></option>
        <option value="fruc" data-i18n="cmp.fruc"></option>
      </select>
      <span class="hint" data-i18n="cmp.hint"></span>
    </div>
    <div id="hdrpreview" style="display:none;margin-top:6px">
      <div id="prevpair">
        <div id="prevprocwrap" style="overflow:hidden;position:relative">
          <img id="prevproc" data-i18n-alt="prev.proc.alt" style="width:100%;display:block;cursor:zoom-in;visibility:hidden">
        </div>
        <div id="prevorigwrap" style="overflow:hidden">
          <img id="prevorig" data-i18n-alt="prev.orig.alt" style="width:100%;display:block;cursor:zoom-in;visibility:hidden">
        </div>
        <div class="prevtag" id="prevoriglabel"></div>
        <div class="prevtag" id="prevproclabel"></div>
        <div id="prevsplit" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-i18n-title="prev.split.tip" data-i18n-aria="prev.split.tip"><span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6 3 12l6 6zM15 6l6 6-6 6z" fill="currentColor"/></svg></span></div>
        <div id="prevorigspin" class="prevspin" style="display:none"><div class="spinwheel"></div></div>
        <div id="prevspin" class="prevspin" style="display:none"><div class="spinwheel"></div></div>
      </div>
      <div class="row" id="prevnav" style="justify-content:center;gap:10px;margin-top:6px">
        <button id="prevprev" class="mini" style="visibility:hidden" data-i18n="prev.back"></button>
        <span class="v" id="prevlabel"></span>
        <button id="prevnext" class="mini" data-i18n="prev.random"></button>
      </div>
      <div id="cmpgrid" style="display:none">
        <div><div class="hint" id="cmplab0" style="margin-bottom:4px"></div>
          <div class="cmpwrap" id="cmpw0"><img id="cmpimg0" data-i18n-alt="cmp.alt0" style="visibility:hidden">
            <div class="cmpspin" id="cmpspin0"><div class="spinwheel"></div></div></div></div>
        <div><div class="hint" id="cmplab1" style="margin-bottom:4px"></div>
          <div class="cmpwrap" id="cmpw1"><img id="cmpimg1" data-i18n-alt="cmp.alt1" style="visibility:hidden">
            <div class="cmpspin" id="cmpspin1"><div class="spinwheel"></div></div></div></div>
        <div><div class="hint" id="cmplab2" style="margin-bottom:4px"></div>
          <div class="cmpwrap" id="cmpw2"><img id="cmpimg2" data-i18n-alt="cmp.alt2" style="visibility:hidden">
            <div class="cmpspin" id="cmpspin2"><div class="spinwheel"></div></div></div></div>
        <div><div class="hint" id="cmplab3" style="margin-bottom:4px"></div>
          <div class="cmpwrap" id="cmpw3"><img id="cmpimg3" data-i18n-alt="cmp.alt3" style="visibility:hidden">
            <div class="cmpspin" id="cmpspin3"><div class="spinwheel"></div></div></div></div>
      </div>
      <div class="row" id="cmpnav" style="display:none;justify-content:center;gap:10px;margin-top:6px">
        <button id="cmpback" class="mini" data-i18n-title="cmp.back.tip">&lsaquo;</button>
        <span class="v" id="cmplabel"></span>
        <button id="cmpfwd" class="mini" data-i18n-title="cmp.fwd.tip">&rsaquo;</button>
        <button id="cmprand" class="mini" data-i18n="prev.random"></button>
        <button id="cmpsave" class="mini" data-i18n="cmp.save" data-i18n-title="cmp.save.tip"></button>
        <button id="cmpclip" class="mini" data-i18n="cmp.clip" data-i18n-title="cmp.clip.tip"></button>
      </div>
      <div class="hint" id="prevnote" style="text-align:center;margin-top:4px"></div>
    </div>
  </div>

  <div class="row vonly">
    <button id="go" disabled></button>
    <button id="cancel" disabled data-i18n="run.cancel" data-i18n-title="run.cancel.tip"></button>
    <button id="open" disabled data-i18n="run.open"></button>
    <button id="play" disabled data-i18n="run.play"></button>
    <button id="playprev" disabled style="display:none" data-i18n="run.playprev" data-i18n-title="run.playprev.tip"></button>
    <span id="status" class="hint"></span>
  </div>

  <div class="panel vonly"><div id="bar"><div id="fill"></div><div id="pct">0%</div></div>
    <div class="hint" id="frames" style="margin-top:6px"></div>
    <div id="livewrap" style="display:none;margin-top:8px;align-items:flex-start;gap:8px">
      <img id="live" data-i18n-title="run.live.tip" alt=""
           style="display:none;max-width:100%;border-radius:4px">
      <button id="livetoggle" class="mini" data-i18n-title="run.livetoggle.tip"></button>
    </div></div>

  <div id="log" class="vonly"></div>
  </div><!-- /#workspace -->

<script src="app.js"></script>
</body>
</html>
